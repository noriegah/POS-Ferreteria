# Levanta el gateway, los cuatro servicios PHP y la base primaria del proyecto.
name: pos-ferreteria
services:
# Nginx es la entrada HTTP y sirve la página inicial.
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      # Nginx solo lee las imágenes que guarda Inventario.
      - ./uploads/productos:/var/www/product-images:ro
    depends_on:
      - auth-service
      - inventario-service
      - ventas-service
      - ventas-secondary
      - reportes-service
    networks: [app-network]
    restart: unless-stopped

# Autenticación trabaja con auth_db y firma los tokens JWT.
  auth-service:
    build: ./services/auth-service
    environment:
      DB_HOST: db-primary
      DB_NAME: auth_db
      DB_USER: ${AUTH_DB_USER:?Configure AUTH_DB_USER in .env}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Configure AUTH_DB_PASSWORD in .env}
      JWT_ISSUER: ${JWT_ISSUER:-pos-ferreteria-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pos-ferreteria-api}
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private.pem
      JWT_TTL: ${JWT_TTL:-900}
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
    expose: ["8083"]
    depends_on:
      db-primary:
        condition: service_healthy
    networks: [app-network, db-network]
    restart: unless-stopped

# Inventario verifica la firma local y consulta por REST el estado y rol en Autenticación.
  inventario-service:
    build: ./services/inventario-service
    environment:
      DB_HOST: db-primary
      DB_NAME: inventario_db
      VENTAS_INTERNAL_KEY: ${VENTAS_INTERNAL_KEY:?Configure VENTAS_INTERNAL_KEY in .env}
      AUTH_URL: http://auth-service:8083
      DB_USER: ${INVENTARIO_DB_USER:?Configure INVENTARIO_DB_USER in .env}
      DB_PASSWORD: ${INVENTARIO_DB_PASSWORD:?Configure INVENTARIO_DB_PASSWORD in .env}
      JWT_ISSUER: ${JWT_ISSUER:-pos-ferreteria-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pos-ferreteria-api}
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
    volumes:
      # Las imágenes quedan en el equipo y sobreviven a una reconstrucción.
      - ./uploads/productos:/app/uploads
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    expose: ["8081"]
    depends_on:
      db-primary:
        condition: service_healthy
    networks: [app-network, db-network]
    restart: unless-stopped

# Ventas guarda sus ventas y consulta Inventario por REST para descontar productos.
  ventas-service:
    build: ./services/ventas-service
    environment:
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      DB_HOST: db-primary
      DB_NAME: ventas_db
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_USD_RATE: ${PAYPAL_USD_RATE:-7.80}
      PAYPAL_RETURN_URL: ${PAYPAL_RETURN_URL:-http://localhost:8080/pago-retorno.html}
      REPORTS_DB_HOST: db-replica
      REPORTS_DB_USER: ${REPORTS_DB_USER:?Configure REPORTS_DB_USER in .env}
      REPORTS_DB_PASSWORD: ${REPORTS_DB_PASSWORD:?Configure REPORTS_DB_PASSWORD in .env}
      DB_USER: ${VENTAS_DB_USER:?Configure VENTAS_DB_USER in .env}
      DB_PASSWORD: ${VENTAS_DB_PASSWORD:?Configure VENTAS_DB_PASSWORD in .env}
      VENTAS_INTERNAL_KEY: ${VENTAS_INTERNAL_KEY:?Configure VENTAS_INTERNAL_KEY in .env}
      JWT_ISSUER: ${JWT_ISSUER:-pos-ferreteria-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pos-ferreteria-api}
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
      INVENTARIO_URL: http://inventario-service:8081
      AUTH_URL: http://auth-service:8083
    volumes:
      # Caché privada de QR: Ventas la lee solo después de verificar el JWT.
      - ./uploads/facturas-qr:/app/storage/facturas-qr
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    expose: ["8082"]
    depends_on:
      db-primary:
        condition: service_healthy
    networks: [app-network, db-network]
    restart: unless-stopped

# Reportes solicita estadísticas por REST a Ventas, sin acceder a otras bases.
  # Segunda instancia del mismo servicio: misma lógica, base y archivos compartidos.
  ventas-secondary:
    extends:
      service: ventas-service

  reportes-service:
    build: ./services/reportes-service
    environment:
      DB_HOST: db-primary
      DB_NAME: reportes_db
      AUTH_URL: http://auth-service:8083
      VENTAS_URL: http://gateway/api/ventas
      INVENTARIO_URL: http://inventario-service:8081
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      WEATHER_LAT: ${WEATHER_LAT:-15.02681}
      WEATHER_LON: ${WEATHER_LON:--90.87815}
    expose: ["8084"]
    depends_on:
      db-primary:
        condition: service_healthy
    networks: [app-network, db-network]
    restart: unless-stopped

# MariaDB guarda las bases lógicas; espera a estar healthy antes de iniciar los servicios PHP.
  db-primary:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configure DB_ROOT_PASSWORD in .env}
    volumes:
      - db_primary_data:/var/lib/mysql
      - ./db-master/replication.cnf:/etc/mysql/conf.d/replication.cnf:ro
      - ./db-master/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [db-network]
    restart: unless-stopped

# Segunda instancia de MariaDB. No publica su puerto SQL en Internet.
  db-replica:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${REPLICA_ROOT_PASSWORD:?Configure REPLICA_ROOT_PASSWORD in .env}
    volumes:
      - db_replica_data:/var/lib/mysql
      - ./db-replica/replication.cnf:/etc/mysql/conf.d/replication.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks: [db-network]
    restart: unless-stopped

# Herramienta local y opcional para explorar tablas con una cuenta de consulta.
  adminer:
    image: adminer:6.1.2
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: db-primary
    ports:
      - "127.0.0.1:8085:8080"
    networks: [app-network, db-network]
    restart: unless-stopped

# La red de aplicación permite HTTP entre contenedores; db-network es interna.
networks:
  app-network: {}
  db-network:
    internal: true

# El volumen de datos conserva MariaDB cuando se recrean los contenedores.
volumes:
  db_primary_data: {}
  db_replica_data: {}
