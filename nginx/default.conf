# Dos instancias de Ventas. Nginx reparte las peticiones por turnos.
upstream ventas_pool {
    zone ventas_pool 64k;
    server ventas-service:8082 max_fails=1 fail_timeout=5s;
    server ventas-secondary:8082 max_fails=1 fail_timeout=5s;
}
# Recibe las peticiones del navegador y las envía al servicio correspondiente.
server {
# Escucha dentro del contenedor; Compose publica este puerto como 8080 en el equipo.
    listen 80;
    # Permite el formulario de imagen; PHP limita el archivo a 2 MB.
    client_max_body_size 3m;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

# Envía /api/auth/ al contenedor de ese servicio y quita ese prefijo de la ruta.
    location /api/auth/ {
        proxy_pass http://auth-service:8083/;
# Conserva el host, la dirección del cliente y el protocolo de la petición.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
# Envía /api/inventario/ al contenedor de ese servicio y quita ese prefijo de la ruta.
    location /api/inventario/ {
        proxy_pass http://inventario-service:8081/;
# Conserva el host, la dirección del cliente y el protocolo de la petición.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
# Envía /api/ventas/ al contenedor de ese servicio y quita ese prefijo de la ruta.
    location /api/ventas/ {
        proxy_pass http://ventas_pool/;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 2;
# Conserva el host, la dirección del cliente y el protocolo de la petición.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
# Envía /api/reportes/ al contenedor de ese servicio y quita ese prefijo de la ruta.
    location /api/reportes/ {
        proxy_pass http://reportes-service:8084/;
# Conserva el host, la dirección del cliente y el protocolo de la petición.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
# Sirve los archivos del frontend; si la ruta no existe, entrega index.html.
    # Sirve las fotos desde un montaje separado; no modifica la carpeta del frontend.
    location /uploads/productos/ {
        alias /var/www/product-images/;
        autoindex off;
        add_header X-Content-Type-Options nosniff;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
